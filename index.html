<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit An Toàn Điện v4.0 (Offline)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #2980b9; --bg: #f5f7fa; --text: #333; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; margin: 0; }
    .header-tools { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .btn-excel { background: #27ae60 !important; flex: 1; }
    
    /* Thanh trạng thái mạng */
    #networkStatus { background: #2ecc71; color: white; text-align: center; padding: 8px; border-radius: 5px; font-weight: bold; font-size: 13px; margin-bottom: 15px; transition: background 0.3s;}
    .offline-mode { background: #e74c3c !important; }
    .syncing-mode { background: #f39c12 !important; }

    table { width: 100%; border-collapse: collapse; background: #fff; display: table; }
    th, td { padding: 10px; border: 1px solid #ddd; font-size: 14px; vertical-align: middle; }
    th { background: #2c3e50; color: white; position: sticky; top: 0; }

    .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
    .photo-item { position: relative; border: 1px solid #ddd; border-radius: 5px; height: 80px; }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 4px; }
    .btn-del { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; width: 20px; height: 20px; border: none; font-size: 12px; cursor: pointer; }

    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
    .modal-content { background: #fff; margin: 5% auto; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; }
    .input-text { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    .btn { padding: 10px 15px; border: none; border-radius: 5px; color: white; background: var(--primary); cursor: pointer; font-weight: bold; }
    
    .img-preview { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; margin: 2px; cursor: pointer; border: 1px solid #eee; transition: transform 0.2s;}
    .img-preview:hover { transform: scale(1.1); }
    
    @media (max-width: 768px) { table { display: none; } .card-container { display: block; } }
    .card-container { display: none; }
    .card { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <h2>📋 Audit An Toàn Điện v4.0</h2>
  
  <div id="networkStatus">🟢 Đang trực tuyến</div>

  <div class="header-tools">
    <select id="filterSection" onchange="filterData()" style="flex: 2; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
      <option value="ALL">-- Tất cả các phần --</option>
    </select>
    <button class="btn btn-excel" onclick="exportToExcel()">📥 Xuất Excel</button>
  </div>

  <div id="loader" style="text-align: center; color: #7f8c8d; font-style: italic;">⌛ Đang tải dữ liệu...</div>

  <table id="dataTable">
    <thead>
      <tr><th width="5%">STT</th><th width="45%">Nội dung kiểm tra</th><th width="20%">Kết quả</th><th width="30%">Hình ảnh</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div class="card-container" id="dataCards"></div>

  <div id="resultModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0; color: #2c3e50;">📝 Cập nhật Mục <span id="modalStt"></span></h3>
      <label><b>Kết quả kiểm tra:</b></label>
      <input type="text" id="modalKetQua" class="input-text" placeholder="Nhập kết quả...">
      <button class="btn" onclick="updateTextOnly()" style="width: 100%; background: #27ae60;">💾 Lưu chữ trước</button>
      
      <hr style="margin: 20px 0; border: 0; border-top: 1px dashed #ddd;">
      
      <label><b>Hình ảnh minh chứng:</b></label>
      <div class="photo-grid" id="modalPhotoGrid"></div>
      
      <div style="position: relative; overflow: hidden; margin-top: 10px;">
        <button class="btn" style="width: 100%; background: #e67e22;">📸 Chụp thêm ảnh</button>
        <input type="file" accept="image/*" capture="environment" onchange="uploadPhoto(this)" style="position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;">
      </div>
      <div id="uploadStatus" style="text-align:center; color: #d35400; font-size:13px; margin-top:5px; font-weight: bold;"></div>
      
      <button class="btn" onclick="closeModal()" style="width: 100%; margin-top: 15px; background: #95a5a6;">Đóng cửa sổ</button>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxjAAk3DMCXW_XeH1WeBhri2ukCYrFO3j6FlQLiwW8XD2I2K2PQvpjTkdeXi7HsZW7u6w/exec";
    let allData = [];
    let currentRowIndex = null;

    // --- ĐĂNG KÝ SERVICE WORKER (CHO PHÉP TRANG WEB LOAD KHI MẤT MẠNG) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('Service Worker OK')).catch(err => console.log('SW Lỗi', err));
      });
    }

    // --- CƠ SỞ DỮ LIỆU OFFLINE (INDEXEDDB) ---
    let db;
    const request = indexedDB.open("AuditOfflineDB", 1);
    request.onupgradeneeded = e => { db = e.target.result; db.createObjectStore("syncQueue", { keyPath: "id" }); };
    request.onsuccess = e => { db = e.target.result; updateNetworkStatus(); };

    function addToQueue(payload) {
      payload.id = Date.now().toString() + Math.random().toString(); // Tạo ID duy nhất
      const tx = db.transaction("syncQueue", "readwrite");
      tx.objectStore("syncQueue").add(payload);
      tx.oncomplete = () => { updateNetworkStatus(); };
    }

    // Lắng nghe sự kiện Bật/Tắt mạng của điện thoại
    window.addEventListener('online', syncOfflineData);
    window.addEventListener('offline', updateNetworkStatus);

    function updateNetworkStatus() {
      const statusDiv = document.getElementById('networkStatus');
      if (navigator.onLine) {
        if (!db) { statusDiv.className = ''; statusDiv.innerText = "🟢 Đang trực tuyến"; return; }
        // Kiểm tra xem có dữ liệu chờ đồng bộ không
        const req = db.transaction("syncQueue", "readonly").objectStore("syncQueue").count();
        req.onsuccess = () => {
          if (req.result > 0) {
            statusDiv.className = 'syncing-mode';
            statusDiv.innerText = `🔄 Có mạng! Đang tự động đồng bộ ${req.result} mục chờ...`;
            syncOfflineData();
          } else {
            statusDiv.className = '';
            statusDiv.innerText = "🟢 Đang trực tuyến";
          }
        };
      } else {
        const req = db.transaction("syncQueue", "readonly").objectStore("syncQueue").count();
        req.onsuccess = () => {
          statusDiv.className = 'offline-mode';
          statusDiv.innerText = `🔴 Mất mạng (Đã lưu tạm ${req.result} mục, sẽ đồng bộ khi có mạng)`;
        };
      }
    }

    // --- HÀM ĐỒNG BỘ DỮ LIỆU KHI CÓ MẠNG ---
    async function syncOfflineData() {
      if (!navigator.onLine) return;
      const tx = db.transaction("syncQueue", "readonly");
      const store = tx.objectStore("syncQueue");
      const request = store.getAll();
      
      request.onsuccess = async () => {
        const items = request.result;
        if (items.length === 0) return;
        
        for (const item of items) {
          try {
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(item) });
            const data = await res.json();
            if (data.success) {
              // Gửi thành công -> XÓA DỮ LIỆU TẠM
              db.transaction("syncQueue", "readwrite").objectStore("syncQueue").delete(item.id);
            }
          } catch(e) {
            console.error("Lỗi đồng bộ", e);
            break; // Nếu mạng chập chờn, ngừng đồng bộ, đợi lần sau
          }
        }
        updateNetworkStatus();
        loadData(); // Tải lại dữ liệu mới nhất từ server
      };
    }

    // --- HÀM TẢI DỮ LIỆU (TỪ SERVER HOẶC TỪ CACHE) ---
    async function loadData() {
      try {
        const res = await fetch(WEB_APP_URL);
        const response = await res.json();
        if (response.success) {
          allData = response.data;
          // Lưu Cache vào máy để xem offline
          localStorage.setItem('auditCachedData', JSON.stringify(allData));
          populateFilterAndRender();
        }
      } catch (err) {
        // NẾU MẤT MẠNG -> ĐỌC DỮ LIỆU TỪ BỘ NHỚ TẠM
        const cached = localStorage.getItem('auditCachedData');
        if (cached) {
          allData = JSON.parse(cached);
          populateFilterAndRender();
        } else {
          document.getElementById('loader').innerText = "❌ Không có mạng và chưa có dữ liệu lưu tạm.";
        }
      }
    }

    function populateFilterAndRender() {
      if (document.getElementById('filterSection').options.length === 1) {
        const sections = [...new Set(allData.map(d => d.phanKiemTra))];
        sections.forEach(s => {
          if (s) {
            const opt = document.createElement('option');
            opt.value = opt.text = s;
            document.getElementById('filterSection').appendChild(opt);
          }
        });
      }
      filterData();
    }

    function filterData() {
      const val = document.getElementById('filterSection').value;
      const data = val === 'ALL' ? allData : allData.filter(d => d.phanKiemTra === val);
      render(data);
    }

    function convertLink(url) {
      if(!url) return "";
      if(url.startsWith('data:image')) return url; // Bỏ qua nếu là ảnh Base64 Offline (Ảnh tạm)
      const id = url.split('/d/')[1]?.split('/')[0] || url.split('id=')[1]?.split('&')[0];
      return id ? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : url;
    }

    function render(data) {
      document.getElementById('loader').style.display = 'none';
      const tbody = document.querySelector('#dataTable tbody');
      const cards = document.getElementById('dataCards');
      tbody.innerHTML = cards.innerHTML = '';

      data.forEach(row => {
        const validLinks = row.hinhAnh.filter(link => link && link.trim() !== '');
        const imgTags = validLinks.length > 0 
          ? validLinks.map(link => `<img src="${convertLink(link)}" class="img-preview" onclick="window.open('${link}')">`).join('') 
          : ''; 
        
        // Bảng
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="text-align: center;"><b>${row.stt}</b></td>
          <td>${row.mucKiemTra}</td>
          <td style="text-align: center;">
             <div style="font-weight: bold; color: #d35400; margin-bottom: 5px;">${row.ketQua || ''}</div>
             <button class="btn" onclick="openModal(${row.rowIndex})" style="font-size: 12px; padding: 5px 10px;">📝 Cập nhật</button>
          </td>
          <td>${imgTags}</td>`;
        tbody.appendChild(tr);

        // Card
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div style="display:inline-block; background:#e8f4f8; color:#2980b9; padding:2px 8px; border-radius:4px; font-size:12px; font-weight:bold; margin-bottom:8px;">Mục ${row.stt}</div>
          <p style="margin-top: 0; font-size: 14.5px;">${row.mucKiemTra}</p>
          <div style="display:flex; justify-content:space-between; align-items:center; border-top: 1px dashed #eee; padding-top: 10px;">
            <div style="flex: 1;">
              <div style="color: #d35400; font-weight: bold; font-size: 14px; margin-bottom: 5px;">${row.ketQua || 'Chưa kiểm tra'}</div>
              <button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="openModal(${row.rowIndex})">📝 Cập nhật</button>
            </div>
            <div style="margin-left: 10px;">${imgTags}</div>
          </div>`;
        cards.appendChild(card);
      });
    }

    function openModal(idx) {
      currentRowIndex = idx;
      const row = allData.find(r => r.rowIndex === idx);
      document.getElementById('modalStt').innerText = row.stt;
      document.getElementById('modalKetQua').value = row.ketQua || '';
      document.getElementById('uploadStatus').innerText = '';
      refreshPhotoGrid(row.hinhAnh);
      document.getElementById('resultModal').style.display = 'block';
    }

    function refreshPhotoGrid(links) {
      const validLinks = links.filter(link => link && link.trim() !== '');
      document.getElementById('modalPhotoGrid').innerHTML = validLinks.map(link => `
        <div class="photo-item">
          <img src="${convertLink(link)}">
          <button class="btn-del" onclick="deletePhoto('${link}')">X</button>
        </div>
      `).join('');
    }

    // --- CÁC HÀM XỬ LÝ (TỰ ĐỘNG LƯU OFFLINE NẾU MẤT MẠNG) ---
    async function updateTextOnly() {
      const val = document.getElementById('modalKetQua').value.trim();
      document.getElementById('uploadStatus').innerText = "⏳ Đang xử lý...";
      
      const payload = { action: 'update_text', rowIndex: currentRowIndex, ketQua: val };
      
      // LƯU CỤC BỘ TRƯỚC ĐỂ UI CẬP NHẬT NGAY
      allData.find(r => r.rowIndex === currentRowIndex).ketQua = val;
      localStorage.setItem('auditCachedData', JSON.stringify(allData));
      filterData();

      try {
        const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
        await res.json();
        document.getElementById('uploadStatus').innerText = "✅ Đã lưu lên máy chủ!";
      } catch (err) {
        addToQueue(payload); // Nếu lỗi mạng -> Đẩy vào hàng đợi
        document.getElementById('uploadStatus').innerText = "📴 Đã lưu ngoại tuyến (Sẽ đồng bộ sau)!";
      }
    }

    async function uploadPhoto(input) {
      const file = input.files[0];
      if(!file) return;
      document.getElementById('uploadStatus').innerText = "⏳ Đang xử lý ảnh...";
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        const base64Str = e.target.result.split(',')[1];
        const payload = {
          action: 'upload_image', rowIndex: currentRowIndex,
          base64: base64Str, mimeType: file.type, fileName: file.name
        };

        // HIỂN THỊ ẢNH NGAY LẬP TỨC CHO NGƯỜI DÙNG BẰNG BASE64 LOCAL
        const tempLocalUrl = `data:${file.type};base64,${base64Str}`;
        const row = allData.find(r => r.rowIndex === currentRowIndex);
        row.hinhAnh.push(tempLocalUrl);
        refreshPhotoGrid(row.hinhAnh);
        localStorage.setItem('auditCachedData', JSON.stringify(allData));
        filterData();

        try {
          const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
          const data = await res.json();
          if(data.success) {
            document.getElementById('uploadStatus').innerText = "✅ Tải ảnh lên Drive thành công!";
            // Cập nhật lại link thật từ Drive thay cho link tạm
            row.hinhAnh[row.hinhAnh.length - 1] = data.imageUrl; 
            localStorage.setItem('auditCachedData', JSON.stringify(allData));
          }
        } catch (err) {
          addToQueue(payload); // Mất mạng -> Lưu hàng đợi
          document.getElementById('uploadStatus').innerText = "📴 Đã lưu ảnh ngoại tuyến!";
        }
      };
      reader.readAsDataURL(file);
    }

    async function deletePhoto(url) {
      if(!confirm("Xoá ảnh này khỏi báo cáo?")) return;
      
      const row = allData.find(r => r.rowIndex === currentRowIndex);
      row.hinhAnh = row.hinhAnh.filter(l => l !== url);
      refreshPhotoGrid(row.hinhAnh);
      localStorage.setItem('auditCachedData', JSON.stringify(allData));
      filterData();

      // Tránh xóa ảnh tạm (chưa lên server)
      if (url.startsWith('data:image')) return;

      const payload = { action: 'delete_image', rowIndex: currentRowIndex, imageUrl: url };
      try {
         await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
         document.getElementById('uploadStatus').innerText = "✅ Đã xoá ảnh trên máy chủ!";
      } catch(e) {
         addToQueue(payload);
         document.getElementById('uploadStatus').innerText = "📴 Đã lưu lệnh xoá ngoại tuyến!";
      }
    }

    function exportToExcel() {
      const exportData = allData.map(r => {
        const validLinks = r.hinhAnh.filter(link => link && link.trim() !== '' && !link.startsWith('data:image'));
        return {
          "STT": r.stt, "Phần": r.phanKiemTra, "Nội dung kiểm tra": r.mucKiemTra,
          "Căn cứ": r.canCu, "Kết quả": r.ketQua || "", "Link Hình ảnh": validLinks.join("\n")
        };
      });
      const ws = XLSX.utils.json_to_sheet(exportData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "AuditData");
      XLSX.writeFile(wb, `BaoCao_Audit_${new Date().toLocaleDateString('vi-VN')}.xlsx`);
    }

    function closeModal() { document.getElementById('resultModal').style.display = 'none'; }
    window.onload = loadData;
  </script>
</body>
</html>
